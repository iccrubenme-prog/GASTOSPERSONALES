<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F3A8F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finanzas RME">
<title>Finanzas RME</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* App móvil: barra superior + contenido desplazable + barra de pestañas inferior con botón central de registro */
:root{
  --bg:#f2f3f8; --surface:#ffffff; --ink:#151a33; --muted:#5d6380; --line:#e0e3ee;
  --primary:#2f3a8f; --primary-ink:#ffffff; --primary-soft:#e7e9f8;
  --pos:#1d7a4c; --neg:#b3362e; --warn:#a6670d;
  --radius:16px; --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#0f111b; --surface:#191c2b; --ink:#e9ebf5; --muted:#9ba1bc; --line:#2a2e44;
    --primary:#8f9cff; --primary-ink:#0f111b; --primary-soft:#252a4d; --pos:#4cc38a; --neg:#f2766b; --warn:#e3a84d; color-scheme:dark; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.4;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column}
.bar{background:var(--primary);color:var(--primary-ink);padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:center;gap:10px}
.bar h1{font-size:19px;margin:0;font-weight:700;flex:1;letter-spacing:-.01em}
.bar .back{color:inherit;font-size:22px;padding:0 6px 0 0;display:none}
.bar.sub .back{display:block}
.sync{font-size:12px;opacity:.85;padding:3px 8px;border-radius:99px;background:rgb(255 255 255 / .16)}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 100px}
.page{display:none;gap:12px;flex-direction:column}
.page.on{display:flex}
.card{background:var(--surface);border-radius:var(--radius);padding:14px;border:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.card h2{font-size:15px;margin:0;font-weight:700}
.row{display:flex;align-items:center;gap:8px}
.row .grow{flex:1;min-width:0}
.between{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.muted{color:var(--muted)} .small{font-size:12.5px} .pos{color:var(--pos)} .neg{color:var(--neg)} .warn{color:var(--warn)}
.big{font-size:28px;font-weight:800;letter-spacing:-.02em}
.mid{font-size:18px;font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px}
.kpi .l{font-size:12px;color:var(--muted)} .kpi .v{font-size:16px;font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero{background:var(--primary);color:var(--primary-ink);border:0}
.hero .muted{color:inherit;opacity:.8}
.track{height:10px;border-radius:99px;background:rgb(127 127 127 / .2);overflow:hidden}
.fill{height:100%;border-radius:99px;background:var(--pos)}
.fill.warn{background:var(--warn)} .fill.over{background:var(--neg)}
.hero .track{background:rgb(255 255 255 / .25)} .hero .fill{background:var(--primary-ink)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:13.5px;font-weight:600;white-space:nowrap}
body.privado .priv{filter:blur(8px);-webkit-user-select:none;user-select:none}
.iconbtn{color:inherit;width:36px;height:36px;border-radius:99px;display:grid;place-items:center;background:rgb(255 255 255 / .16)}
.pw{position:relative}
.pw input{width:100%;padding:12px 44px;border-radius:12px;border:0;font-size:16px;text-align:center;background:#fff;color:#151a33}
.pw.oculta input{color:transparent;caret-color:#151a33}
.pw .mask{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:20px;letter-spacing:4px;color:#151a33;pointer-events:none;font-weight:700}
.pw.oculta .mask{display:flex}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;display:grid;place-items:center;color:#2f3a8f}
.chip .cnt{opacity:.6;font-weight:500}
.chip.on{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.item:last-child{border-bottom:0}
.ico{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:13px;font-weight:800;flex:none;background:var(--primary-soft);color:var(--primary)}
.ico.g{background:color-mix(in srgb,var(--neg) 14%,transparent);color:var(--neg)}
.ico.i{background:color-mix(in srgb,var(--pos) 15%,transparent);color:var(--pos)}
.ico.v{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.item .grow{flex:1;min-width:0}
.sheet > *{flex:none}
.item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:700;white-space:nowrap}
.day{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-weight:700;padding:12px 2px 2px;text-transform:capitalize}
.bars{display:flex;flex-direction:column;gap:9px}
.bar-r .between{font-size:13.5px}
.bar-r .track{height:8px;margin-top:4px;position:relative}
.bar-r .fill{background:var(--primary)}
.mark{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.55}
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;align-items:end;height:120px}
.mcol{display:flex;gap:1px;align-items:end;height:100%}
.mcol span{flex:1;border-radius:3px 3px 0 0;min-height:1px}
.mlab{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;font-size:10.5px;color:var(--muted);text-align:center}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav button{width:38px;height:38px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:18px}
.nav b{font-size:15px;text-transform:capitalize}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 2px;border-radius:9px;font-weight:600;font-size:12.5px;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--primary);color:var(--primary-ink)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase}
td.n,th.n{text-align:right;white-space:nowrap}
.tbl{overflow-x:auto}
table.compacta th,table.compacta td{padding:6px 3px}
.search{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.menu .item{padding:14px 4px}
.menu .item .arrow{color:var(--muted);font-size:18px}
.empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:14px}
.btn{padding:12px 16px;border-radius:12px;font-weight:700;background:var(--primary-soft);color:var(--primary)}
.btn.primary{background:var(--primary);color:var(--primary-ink)}
.btn.danger{background:transparent;color:var(--neg)}
.btn.sm{padding:7px 12px;font-size:13px}
/* barra inferior */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(env(safe-area-inset-bottom) + 6px);z-index:10}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:4px 0}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--primary)}
.tab.add{justify-content:center}
.tab.add span{width:54px;height:54px;border-radius:18px;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;margin-top:-26px;box-shadow:0 6px 18px rgb(47 58 143 / .35)}
.tab.add svg{width:28px;height:28px}
/* hoja de registro */
#scrim{position:fixed;inset:0;background:rgb(8 10 20 / .45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92%;overflow-y:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:8px 16px calc(env(safe-area-inset-bottom) + 16px);transform:translateY(105%);transition:transform .25s ease;z-index:21;display:flex;flex-direction:column;gap:12px}
.sheet.on{transform:none}
.grab{width:42px;height:5px;border-radius:99px;background:var(--line);margin:4px auto 2px}
.f{display:flex;flex-direction:column;gap:4px}
.f label{font-size:12px;color:var(--muted);font-weight:700}
.f input,.f select{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);min-height:44px}
.f input.monto{font-size:30px;font-weight:800;padding:8px 12px;text-align:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hide{display:none!important}
.err{color:var(--neg);font-size:13px;min-height:1em}
.actions{display:flex;gap:8px}
.actions .btn{flex:1}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.on{opacity:1}
#splash{position:fixed;inset:0;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:40;padding:24px;
  background:radial-gradient(120% 80% at 50% 0%, #4a58c9 0%, #2f3a8f 45%, #161c4d 100%);transition:opacity .45s ease, transform .45s ease}
#splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
#splash small{font-weight:500;opacity:.85;font-size:13px;max-width:300px;text-align:center;min-height:1.2em}
.sp-logo{filter:drop-shadow(0 10px 30px rgb(0 0 0 / .35));animation:spIn .7s cubic-bezier(.2,.9,.3,1.3) both}
.sp-orbit{transform-origin:60px 60px;animation:spSpin 1.6s linear infinite}
.sp-bar{transform-box:fill-box;transform-origin:bottom;animation:spGrow 1.4s ease-in-out infinite alternate}
.sp-bar.b2{animation-delay:.2s}.sp-bar.b3{animation-delay:.4s}
.sp-line{stroke-dasharray:70;stroke-dashoffset:70;animation:spDraw 1.4s .3s ease forwards}
.sp-dot{animation:spPulse 1.4s 1.2s ease-in-out infinite}
.sp-title{font-size:30px;font-weight:800;letter-spacing:-.02em;animation:spUp .6s .15s ease both}
.sp-title span{background:linear-gradient(90deg,#ffd36e,#9fe3c0);-webkit-background-clip:text;background-clip:text;color:transparent}
.sp-sub{font-size:14px;opacity:.8;margin-top:-6px;animation:spUp .6s .25s ease both}
.sp-prog{width:240px;height:8px;border-radius:99px;background:rgb(255 255 255 / .16);overflow:hidden;margin-top:14px;animation:spUp .6s .35s ease both}
.sp-fill{height:100%;width:4%;border-radius:99px;background:linear-gradient(90deg,#9fe3c0,#ffd36e);position:relative;transition:width .5s ease}
.sp-fill::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgb(255 255 255 / .6),transparent);animation:spShine 1.1s linear infinite}
.sp-tip{font-size:12.5px;opacity:.7;max-width:280px;text-align:center;min-height:2.6em;transition:opacity .4s}
#splash.listo .sp-prog,#splash.listo .sp-tip{display:none}
@keyframes spSpin{to{transform:rotate(360deg)}}
@keyframes spGrow{from{transform:scaleY(.45)}to{transform:scaleY(1)}}
@keyframes spDraw{to{stroke-dashoffset:0}}
@keyframes spPulse{0%,100%{r:4;opacity:1}50%{r:6;opacity:.6}}
@keyframes spIn{from{opacity:0;transform:scale(.6) rotate(-20deg)}to{opacity:1;transform:none}}
@keyframes spUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes spShine{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
@media (prefers-reduced-motion:reduce){.sp-orbit,.sp-bar,.sp-fill::after,.sp-dot{animation:none}.sp-line{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header class="bar" id="bar"><button class="back" id="back" aria-label="Regresar">‹</button><h1 id="vTitle">Finanzas RME</h1><span class="sync" id="sync"></span><button id="privBtn" class="iconbtn" aria-label="Ocultar ingresos y ahorro" title="Ocultar ingresos y ahorro"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button><button id="salir" class="sync" style="color:inherit;font-weight:700;padding:6px 12px" aria-label="Salir de la app">Salir</button></header>
  <main id="scr">
    <section class="page on" id="p-inicio"></section>
    <section class="page" id="p-movs">
      <div class="nav"><button id="mvPrev" aria-label="Mes anterior">‹</button><b id="mvMes"></b><button id="mvNext" aria-label="Mes siguiente">›</button></div>
      <input class="search" id="mvQ" type="search" placeholder="Buscar en todo el historial…" aria-label="Buscar">
      <div class="chips" id="mvChips"></div>
      <div class="small muted" id="mvSum"></div>
      <div class="card" style="padding:4px 12px"><div class="list" id="mvList"></div></div>
    </section>
    <section class="page" id="p-anal">
      <div class="seg" id="anSeg"><button data-a="cat" class="on">Catorcena</button><button data-a="tend">Tendencia</button><button data-a="mes">Mes</button><button data-a="anio">Año</button><button data-a="ing">Ingresos</button><button data-a="autos">Autos</button></div>
      <div class="nav"><button id="anPrev" aria-label="Anterior">‹</button><b id="anPer"></b><button id="anNext" aria-label="Siguiente">›</button></div>
      <div id="anBody" style="display:flex;flex-direction:column;gap:12px"></div>
    </section>
    <section class="page" id="p-mas">
      <div class="card menu" style="padding:2px 12px">
        <button class="item" data-sub="ahorro"><span class="ico i">A</span><span class="grow"><div class="t">Ahorros</div><div class="s">Acumulado, meta por catorcena, fondo y total de dinero</div></span><span class="arrow">›</span></button>
        <button class="item" data-sub="cuentas"><span class="ico">$</span><span class="grow"><div class="t">Tarjetas y cuentas</div><div class="s">Deuda por tarjeta, saldos y pagos</div></span><span class="arrow">›</span></button>
        <button class="item" data-sub="msi"><span class="ico">MSI</span><span class="grow"><div class="t">Compras a meses</div><div class="s">Liverpool / Fábricas, Palacio, Sears y tarjetas</div></span><span class="arrow">›</span></button>
        <button class="item" data-sub="inv"><span class="ico v">%</span><span class="grow"><div class="t">Inversiones</div><div class="s">SOFIPOs, bancos y efectivo</div></span><span class="arrow">›</span></button>
        <button class="item" data-sub="vales"><span class="ico i">V</span><span class="grow"><div class="t">Vales de despensa</div><div class="s">Depósitos, gasto y saldo</div></span><span class="arrow">›</span></button>
        <button class="item" data-sub="pres"><span class="ico">P</span><span class="grow"><div class="t">Presupuesto</div><div class="s">Monto mensual por categoría</div></span><span class="arrow">›</span></button>
      </div>
      <div class="card menu" style="padding:2px 12px">
        <button class="item" id="reload"><span class="ico">↻</span><span class="grow"><div class="t">Actualizar datos</div><div class="s" id="lastSync">Vuelve a leer la hoja de Google</div></span></button>
        <button class="item hide" id="olvidar"><span class="ico">🔑</span><span class="grow"><div class="t">Olvidar clave guardada</div><div class="s">La app te la pedirá la próxima vez</div></span></button>
        <a class="item" id="sheetLink" href="#" target="_blank" rel="noopener" style="color:inherit;text-decoration:none"><span class="ico">⊞</span><span class="grow"><div class="t">Abrir la hoja de Google</div><div class="s">Catálogos, saldos iniciales y respaldo</div></span><span class="arrow">↗</span></a>
      </div>
      <p class="small muted" id="about"></p>
    </section>
    <section class="page" id="p-sub"></section>
  </main>
  <nav class="tabbar" id="tabbar">
    <button class="tab on" data-v="inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</button>
    <button class="tab" data-v="movs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Movimientos</button>
    <button class="tab add" id="addBtn" aria-label="Registrar movimiento"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg></span></button>
    <button class="tab" data-v="anal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Análisis</button>
    <button class="tab" data-v="mas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>Más</button>
  </nav>
</div>

<div id="scrim"></div>
<form class="sheet" id="sheet" novalidate>
  <div class="grab"></div>
  <div class="between"><h2 id="fTitle" style="margin:0;font-size:18px">Nuevo movimiento</h2><button type="button" class="btn sm" id="fClose">Cerrar</button></div>
  <div class="chips" id="fTipo">
    <button type="button" class="chip" data-t="Gasto">Gasto</button>
    <button type="button" class="chip" data-t="Ingreso">Ingreso</button>
    <button type="button" class="chip" data-t="Pago tarjeta">Pago de tarjeta</button>
    <button type="button" class="chip" data-t="Transferencia">Transferencia</button>
    <button type="button" class="chip" data-t="Inversión">Inversión</button>
  </div>
  <div class="f"><label for="fMonto">Monto</label><input class="monto" id="fMonto" type="number" inputmode="decimal" step="0.01" min="0" placeholder="$0"></div>
  <div class="chips" id="fQuick"></div>
  <div class="two">
    <div class="f"><label for="fFecha">Fecha</label><input id="fFecha" type="date"></div>
    <div class="f" data-for="Gasto"><label for="fCat">Categoría</label><select id="fCat"></select></div>
    <div class="f" data-for="Ingreso"><label for="fFuente">Fuente</label><select id="fFuente"></select></div>
    <div class="f" data-for="Inversión"><label for="fInvM">Movimiento</label><select id="fInvM"><option>Aportación</option><option>Retiro</option><option>Rendimiento</option></select></div>
  </div>
  <div class="f"><label for="fDesc">Descripción</label><input id="fDesc" list="dlDesc" autocomplete="off" placeholder="Comida, gasolina, estacionamiento…"></div>
  <datalist id="dlDesc"></datalist>
  <div class="two" data-for="Gasto">
    <div class="f"><label for="fSub">Subcategoría</label><input id="fSub" list="dlSub" autocomplete="off"></div>
    <div class="f" data-for="msi"><label for="fMsi">Meses sin intereses</label><select id="fMsi"><option value="">De contado</option><option>3</option><option>6</option><option>9</option><option>12</option><option>13</option><option>18</option><option>24</option></select></div>
  </div>
  <datalist id="dlSub"></datalist>
  <div data-for="veh" class="f"><label>Vehículo</label><div class="chips" id="fVeh"></div></div>
  <div class="two" data-for="veh">
    <div class="f"><label for="fKm">Kilometraje</label><input id="fKm" type="number" inputmode="numeric" min="0" placeholder="Opcional"></div>
    <div class="f"><label for="fLt">Litros</label><input id="fLt" type="number" inputmode="decimal" step="0.01" min="0" placeholder="Si es gasolina"></div>
  </div>
  <div class="f" data-for="Inversión"><label for="fIns">Instrumento</label><select id="fIns"></select></div>
  <div class="two">
    <div class="f" data-for="cta"><label for="fCta" id="fCtaL">Pagado con</label><select id="fCta"></select></div>
    <div class="f" data-for="dst"><label for="fDst" id="fDstL">Entra a</label><select id="fDst"></select></div>
  </div>
  <div class="f" data-for="vales">

<script>
"use strict";
/* ================= estado ================= */
const S = { d:null, movs:[], byId:{}, view:"inicio", sub:null, mes:"", anio:0, an:"cat", anMes:"", anAnio:0, filtro:"todos", q:"", lim:200 };
const MES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const MESL = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const $ = (s,r=document)=>r.querySelector(s), $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mx = n => (n<0?"−$":"$") + Math.abs(Math.round(n||0)).toLocaleString("es-MX");
const nmx = n => Math.round(n||0).toLocaleString("es-MX");
const mx2 = n => ((+n||0)<0?"−$":"$") + Math.abs(+n||0).toLocaleString("es-MX",{minimumFractionDigits:2,maximumFractionDigits:2});
const norm = s => String(s??"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g," ").trim();
const pad = n => String(n).padStart(2,"0");
const addMonth = (ym,k)=>{ let [y,m]=ym.split("-").map(Number); m+=k; while(m<1){m+=12;y--} while(m>12){m-=12;y++} return y+"-"+pad(m); };
const mLabel = ym => MESL[+ym.slice(5)-1]+" "+ym.slice(0,4);
const dLabel = f => { const d=new Date(f+"T12:00"); return d.toLocaleDateString("es-MX",{weekday:"long",day:"numeric",month:"short"}); };
const dm2 = f => +f.slice(8)+"/"+(+f.slice(5,7));
const sDate = f => +f.slice(8)+" "+MES[+f.slice(5,7)-1];
const daysBetween = (a,b)=> Math.round((new Date(b+"T12:00")-new Date(a+"T12:00"))/864e5);
const sum = a => a.reduce((s,x)=>s+(+x.Monto||0),0);
const uid = () => ("M"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)).toUpperCase();
function store(k,v){ try{ if(v===undefined) return JSON.parse(localStorage.getItem(k)||"null"); localStorage.setItem(k,JSON.stringify(v)); }catch(e){ return null; } }
let toastT; function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"),2600); }
const API_URL = "https://script.google.com/macros/s/AKfycbwGIeHfWXEUl7U7PtOCsCBfqeAPuGp2Dvm7jEDhtK8vN2y29mITmKA7ss8lU7M7iolwYg/exec";
function api(fn, ...args){
  // GET: es la forma que Apps Script acepta sin problemas desde otra página (POST falla por CORS)
  const q = new URLSearchParams({action:fn, args:JSON.stringify(args), clave:getClave(), t:Date.now()});
  return fetch(API_URL+"?"+q.toString(), {redirect:"follow"})
    .then(r=>{ if(!r.ok) throw new Error("El servidor respondió "+r.status); return r.json(); })
    .then(j=>{ if(!j.ok){ const e=new Error(j.error||"Error"); e.auth=!!j.auth; e.srv=true; throw e; } return j.data; });
}
function pwSync(){ const v=$("#claveIn").value; $("#pwMask").textContent="*".repeat(v.length); }
document.addEventListener("input",e=>{ if(e.target.id==="claveIn") pwSync(); });
document.addEventListener("click",e=>{ if(!e.target.closest("#pwEye")) return; const box=$("#pwBox"), oc=box.classList.toggle("oculta"); $("#pwEye").innerHTML = oc? '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>' : '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l18 18M10.6 5.1A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.2M6.6 6.6C3.9 8.3 2 12 2 12s3.5 7 10 7c1.8 0 3.4-.5 4.8-1.3M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>'; $("#pwEye").setAttribute("aria-label", oc?"Mostrar clave":"Ocultar clave"); $("#claveIn").focus(); });
// clave: guardada en el teléfono (si aceptas) o solo mientras la app esté abierta
function getClave(){ let s=""; try{ s=sessionStorage.getItem("fc_clave_ses")||""; }catch(e){} return store("fc_clave")||s; }
function claveGuardada(){ return !!store("fc_clave"); }
function setClaveSesion(v){ try{ sessionStorage.setItem("fc_clave_ses",v); }catch(e){} }
function olvidarClave(){ store("fc_clave",""); try{ sessionStorage.removeItem("fc_clave_ses"); localStorage.removeItem("fc_cache"); }catch(e){} }
function preguntarGuardar(){
  if(claveGuardada() || store("fc_noPreguntar")) return;
  const box=document.createElement("div");
  box.id="askSave";
  box.style.cssText="position:fixed;inset:0;background:rgb(8 10 20 / .5);display:flex;align-items:flex-end;z-index:45";
  box.innerHTML=`<div class="sheet on" style="position:relative;transform:none;max-height:none">
    <div class="grab"></div><h2 style="margin:0;font-size:18px">¿Guardar tu clave en este teléfono?</h2>
    <p class="small muted" style="margin:0">Así la app entra directo y no te la vuelve a pedir. Puedes olvidarla cuando quieras desde Más.</p>
    <label class="small muted"><input type="checkbox" id="askNo"> No volver a preguntar</label>
    <div class="actions"><button class="btn" id="askNot">Ahora no</button><button class="btn primary" id="askYes">Guardar clave</button></div></div>`;
  document.body.appendChild(box);
  $("#askYes").onclick=()=>{ store("fc_clave", getClave()); box.remove(); toast("Clave guardada en este teléfono"); renderMas(); };
  $("#askNot").onclick=()=>{ if($("#askNo").checked) store("fc_noPreguntar",true); box.remove(); };
}
function renderMas(){ const b=$("#olvidar"); if(b) b.classList.toggle("hide", !claveGuardada()); }
// para la foto del ticket: POST y, si el navegador lo bloquea, en partes por GET
async function apiGrande(fn, payload, extra, prog){
  try{
    const r=await fetch(API_URL,{method:"POST",redirect:"follow",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:fn,args:[payload,extra],clave:getClave()})});
    const j=await r.json(); if(!j.ok){ const e=new Error(j.error||"Error"); e.auth=!!j.auth; e.srv=true; throw e; } return j.data;
  }catch(e){ if(e.srv) throw e; }
  const id=uid(), size=5000, n=Math.ceil(payload.length/size);
  for(let i=0;i<n;i+=6){
    await Promise.all(Array.from({length:Math.min(6,n-i)},(_,k)=>api("subirParte",id,i+k,payload.slice((i+k)*size,(i+k+1)*size))));
    if(prog) prog(Math.round(Math.min(n,i+6)/n*100));
  }
  return api(fn,{upload:id,partes:n},extra);
}
function avisoCarga(){
  let b=$("#avisoCarga");
  if(!b){ b=document.createElement("div"); b.id="avisoCarga"; b.style.cssText="background:#fde8e6;color:#8a1f17;padding:10px 14px;font-size:13px;display:flex;flex-direction:column;gap:8px;overflow-wrap:anywhere"; $("#app").insertBefore(b,$("#scr")); }
  b.innerHTML=`<span><b>Mostrando la última copia guardada.</b> ${esc(S.errCarga||"")}</span><button class="btn sm" id="reintentar" style="background:#8a1f17;color:#fff;align-self:flex-start">Reintentar</button>`;
  $("#reintentar").onclick=()=>{ b.remove(); $("#splash").classList.remove("hide"); load(); };
}
function pedirClave(msg){
  spStop(); $("#splash").classList.remove("hide"); $("#splash").classList.add("listo"); $("#splashMsg").textContent = msg || "Escribe la clave de acceso de tu app.";
  const f=$("#claveForm"); f.classList.remove("hide"); setTimeout(()=>$("#claveIn").focus(),100);
  f.onsubmit=ev=>{ ev.preventDefault(); const v=$("#claveIn").value.trim(); if(!v) return; S.claveNueva=true; if(claveGuardada()) store("fc_clave",v); else setClaveSesion(v); $("#claveIn").value=""; pwSync(); f.classList.add("hide"); load(); };
}
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});

/* ---- pantalla de entrada: avance y consejos ---- */
const TIPS=["Toca + para registrar un gasto en segundos.","Escanea tus tickets de vales y se llenan los artículos solos.","El ojo de arriba oculta tus ingresos y ahorros si enseñas la app.","En Análisis toca una categoría para ver en qué se fue el dinero.","En Ahorros ves tu meta por catorcena y tu total de dinero."];
let spT=null, spP=0, spTipT=null, spTipI=0;
function spSet(p,msg){ spP=Math.max(spP,p); const f=$("#spFill"); if(f) f.style.width=spP+"%"; if(msg) $("#splashMsg").textContent=msg; }
function spStart(){
  const s=$("#splash"); s.classList.remove("hide","out","listo"); spP=0; spSet(6,"Conectando con tu hoja de Google…");
  clearInterval(spT); spT=setInterval(()=>{ if(spP<82) spSet(spP+Math.max(1,(82-spP)*0.08), spP>35? "Leyendo tus movimientos…" : null); },300);
  const tip=$("#spTip"); clearInterval(spTipT); spTipI=Math.floor(Math.random()*TIPS.length); tip.textContent=TIPS[spTipI];
  spTipT=setInterval(()=>{ tip.style.opacity=0; setTimeout(()=>{ spTipI=(spTipI+1)%TIPS.length; tip.textContent=TIPS[spTipI]; tip.style.opacity=.7; },400); },3200);
}
function spStop(){ clearInterval(spT); clearInterval(spTipT); }
function spDone(){
  spStop(); spSet(100,"¡Listo!");
  const s=$("#splash"); setTimeout(()=>{ s.classList.add("out"); setTimeout(()=>{ s.classList.add("hide"); s.classList.remove("out"); },460); },250);
}
/* ================= carga ================= */
function load(){
  spStart();
  api("getData").then(d=>{
    spSet(90,"Calculando catorcenas y ahorros…"); S.d = d; build(); spDone(); const av=$("#avisoCarga"); if(av) av.remove();
    $("#lastSync").textContent = "Última lectura: "+new Date().toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit"});
    if(d.url) $("#sheetLink").href = d.url;
    render(); flush(); renderMas();
    if(S.claveNueva){ S.claveNueva=false; setTimeout(preguntarGuardar, 400); }
  }).catch(e=>{
    if(e && e.auth){ const habia=!!getClave(); olvidarClave(); return pedirClave(habia? "La clave no es correcta o cambió. Escríbela de nuevo." : null); }
    const cache = store("fc_cache");
    const msg = String(e&&e.message||e);
    S.errCarga = e&&e.srv ? "Tu hoja respondió con un error: "+msg : (navigator.onLine===false? "Sin señal" : "No se pudo contactar a Google ("+msg+")");
    if(cache){ S.d=cache; build(); spDone(); render(); avisoCarga(); }
    else { spStop(); $("#splash").classList.add("listo"); $("#splashMsg").textContent = "No pude leer la hoja: "+(e&&e.message||e)+". Revisa tu conexión y vuelve a abrir la app."; }
  });
}
function rowToObj(r){ const o={}; S.d.movH.forEach((h,i)=>o[h]=r[i]); o.Monto=+o.Monto||0; o.Fecha=String(o.Fecha).slice(0,10); return o; }
function build(){
  const d=S.d;
  S.hoy = hoyLocal();
  if(!S.mes){ S.mes=S.hoy.slice(0,7); S.anMes=S.mes; S.anAnio=+S.hoy.slice(0,4); }
  S.movs = d.movs.map(rowToObj).filter(m=>m.Fecha && m.Tipo);
  applyPending();
  sortMovs();
  S.cta = {}; d.cuentas.forEach(c=>S.cta[c.Cuenta]=c);
  S.cats = {}; S.autoCats = new Set();
  d.categorias.forEach(c=>{ (S.cats[c.Categoria] ||= []).push(c.Subcategoria); if(String(c.EsAuto).toLowerCase().startsWith("s")) S.autoCats.add(c.Categoria); });
  if(!S.autoCats.size) S.autoCats.add("Autos");
  S.vehs = d.vehiculos.filter(v=>!String(v.Activo).toLowerCase().startsWith("n")).map(v=>v.Vehiculo);
  S.fuentes = d.fuentes.map(f=>f.Fuente);
  S.fTipo = {}; d.fuentes.forEach(f=>S.fTipo[f.Fuente]=f.Tipo);
  S.ins = d.instrumentos.filter(i=>!String(i.Activo).toLowerCase().startsWith("n"));
  // memoria de descripciones: la más reciente define categoría, sub, vehículo y cuenta
  S.mem = {}; S.freq = {};
  for(const m of S.movs){ if(m.Tipo!=="Gasto"||!m.Descripcion) continue; const k=norm(m.Descripcion); if(!S.mem[k]) S.mem[k]=m; if(daysBetween(m.Fecha,S.hoy)<=180) S.freq[k]=(S.freq[k]||0)+1; }
  $("#dlDesc").innerHTML = Object.values(S.mem).slice(0,400).map(m=>`<option value="${esc(m.Descripcion)}">`).join("");
  try{ store("fc_cache", Object.assign({}, d, {movs: S.d.movs.slice(-6000)})); }catch(e){}
  $("#about").textContent = S.movs.length.toLocaleString("es-MX")+" movimientos desde "+(S.movs.length? sDate(S.movs[S.movs.length-1].Fecha)+" "+S.movs[S.movs.length-1].Fecha.slice(0,4):"—")+(d.user? " · "+d.user : "");
}
function sortMovs(){ S.movs.sort((a,b)=> a.Fecha<b.Fecha?1 : a.Fecha>b.Fecha?-1 : String(b.ID).localeCompare(String(a.ID))); S.byId={}; S.movs.forEach(m=>S.byId[m.ID]=m); }

/* ================= cola sin conexión ================= */
function pend(){ return store("fc_pend") || []; }
function setPend(p){ store("fc_pend", p); syncBadge(); }
function syncBadge(){ S.pendSet=pendIds(); const n=pend().length; const s=$("#sync"); s.textContent = n? n+" pendiente"+(n>1?"s":"") : ""; s.style.display = n?"":"none"; }
function applyPending(){ for(const p of pend()){ if(p.op==="save"){ const i=S.movs.findIndex(m=>m.ID===p.o.ID); const o=Object.assign({},p.o,{Monto:+p.o.Monto}); if(i>=0) S.movs[i]=o; else S.movs.push(o); } else if(p.op==="del"){ S.movs=S.movs.filter(m=>m.ID!==p.id); } } }
let flushing=false;
async function flush(){
  if(flushing) return; flushing=true;
  try{
    let p=pend();
    while(p.length){
      const it=p[0];
      try{
        if(it.op==="save"){ const row=await api("saveMov", it.o); const o=rowToObj(row); const i=S.movs.findIndex(m=>m.ID===o.ID); if(i>=0) S.movs[i]=o; }
        else await api("deleteMov", it.id);
      }catch(e){
        const msg=String(e&&e.message||e);
        if(e&&e.auth){ syncBadge(); pedirClave("Tu clave cambió. Escríbela de nuevo."); break; } if(/No encontr|Faltan|permiso|desconocida/.test(msg)){ toast(msg); } else { syncBadge(); break; }
      }
      p=pend(); p.shift(); setPend(p);
    }
  } finally { flushing=false; sortMovs(); syncBadge(); render(); }
}
window.addEventListener("online", flush);

/* ================= navegación ================= */
const TITLES = {inicio:"Finanzas RME", movs:"Movimientos", anal:"Análisis", mas:"Más"};
function go(v){ S.view=v; S.sub=null; $$(".page").forEach(p=>p.classList.toggle("on", p.id==="p-"+v)); $$(".tab[data-v]").forEach(t=>t.classList.toggle("on", t.dataset.v===v)); $("#bar").classList.remove("sub"); $("#vTitle").textContent=TITLES[v]; $("#scr").scrollTop=0; render(); }
function openSub(k){ S.sub=k; $$(".page").forEach(p=>p.classList.toggle("on", p.id==="p-sub")); $("#bar").classList.add("sub"); $("#scr").scrollTop=0; render(); }
$("#back").onclick=()=>go("mas");
$$(".tab[data-v]").forEach(t=>t.onclick=()=>go(t.dataset.v));
$$("[data-sub]").forEach(b=>b.onclick=()=>openSub(b.dataset.sub));
$("#addBtn").onclick=()=>openForm();
const EYE='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>', EYEOFF='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l18 18M10.6 5.1A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.2M6.6 6.6C3.9 8.3 2 12 2 12s3.5 7 10 7c1.8 0 3.4-.5 4.8-1.3M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';
function aplicarPriv(){ const on=!!store("fc_priv"); document.body.classList.toggle("privado",on); const b=$("#privBtn"); b.innerHTML=on?EYEOFF:EYE; b.setAttribute("aria-label", on?"Mostrar ingresos y ahorro":"Ocultar ingresos y ahorro"); b.title=b.getAttribute("aria-label"); }
$("#privBtn").onclick=()=>{ store("fc_priv", !store("fc_priv")); aplicarPriv(); toast(store("fc_priv")? "Ingresos y ahorro ocultos" : "Ingresos y ahorro visibles"); };
aplicarPriv();
$("#salir").onclick=()=>{
  const b=$("#salir");
  if(b.dataset.arm!=="1"){ b.dataset.arm="1"; b.textContent="¿Salir?"; setTimeout(()=>{ b.dataset.arm=""; b.textContent="Salir"; },3000); return; }
  if(pend().length){ toast("Hay registros sin sincronizar; espera a tener señal antes de salir."); b.dataset.arm=""; b.textContent="Salir"; return; }
  const guardada=claveGuardada();
  try{ sessionStorage.removeItem("fc_clave_ses"); if(!guardada) localStorage.removeItem("fc_cache"); }catch(e){}
  S.d=null; closeForm();
  try{ window.close(); }catch(e){}
  if(guardada){
    spStop(); $("#splash").classList.remove("hide"); $("#splash").classList.add("listo"); $("#splashMsg").textContent="Saliste de la app. Tu clave sigue guardada en este teléfono.";
    $("#claveForm").classList.add("hide");
    let r=$("#reentrar"); if(!r){ r=document.createElement("button"); r.id="reentrar"; r.className="btn"; r.style.cssText="background:#fff;color:#2f3a8f;width:260px"; r.textContent="Entrar"; $("#splash").appendChild(r); }
    r.classList.remove("hide"); r.onclick=()=>{ r.classList.add("hide"); load(); };
  }
  else if(typeof pedirClave==="function") pedirClave("Sesión cerrada. Escribe tu clave para volver a entrar.");
  else { $("#splash").classList.remove("hide"); $("#splashMsg").textContent="Sesión cerrada. Puedes cerrar esta ventana."; }
};
$("#olvidar").onclick=()=>{ const b=$("#olvidar"); if(b.dataset.arm!=="1"){ b.dataset.arm="1"; $(".t",b).textContent="Toca otra vez para olvidarla"; setTimeout(()=>{ b.dataset.arm=""; $(".t",b).textContent="Olvidar clave guardada"; },3000); return; }
  const c=getClave(); olvidarClave(); setClaveSesion(c); store("fc_noPreguntar",false); b.dataset.arm=""; $(".t",b).textContent="Olvidar clave guardada"; renderMas(); toast("Clave olvidada en este teléfono"); };
$("#reload").onclick=()=>{ $("#splash").classList.remove("hide"); load(); };
function hoyLocal(){ const d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
// la fecha se toma del teléfono en cada pantalla, así el conteo de días cambia aunque la app quede abierta
setInterval(()=>{ if(S.d && hoyLocal()!==S.hoy) render(); }, 60000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && S.d){ render(); if(navigator.onLine) flush(); } });
function render(){
  if(!S.d) return;
  const h=hoyLocal(); if(h!==S.hoy){ const cambioMes = S.mes===S.hoy.slice(0,7); S.hoy=h; if(cambioMes){ S.mes=h.slice(0,7); S.anMes=S.mes; } S.mvCat=null; S.anCat=null; }

  if(S.sub) return renderSub();

/* ================= cálculos ================= */
const inRange = (a,b)=> S.movs.filter(m=>m.Fecha>=a && m.Fecha<=b);
const inMonth = ym => S.movs.filter(m=>m.Fecha.startsWith(ym));
function catorcenaActual(f){ return S.d.catorcenas.find(c=>c.Inicio<=f && f<=c.Fin); }
const NOMINA="Nómina (catorcena)", VALES="Vales de despensa";
function catList(){ return S.d.catorcenas.filter(c=>c.Inicio<=S.hoy).sort((a,b)=>a.Inicio<b.Inicio?-1:1); }
const FONDO="Fondo de ahorro";
function esPrest(f){ return S.fTipo[f]==="Prestación" && f!==VALES; }
function esExtra(f){ return S.fTipo[f]==="Extra" || (!S.fTipo[f] && f!==NOMINA && f!==VALES); }
function ahorroCat(c){ const v = c.AhorroCatorcena!==undefined ? c.AhorroCatorcena : c.MetaAhorro; return v===""||v==null ? null : +v; }
function catRes(c){
  const r=inRange(c.Inicio,c.Fin);
  const gas=r.filter(m=>m.Tipo==="Gasto"&&m.Cuenta!==VALES);
  const nom=r.filter(m=>m.Tipo==="Ingreso"&&m.Fuente===NOMINA);
  const ext=r.filter(m=>m.Tipo==="Ingreso"&&esExtra(m.Fuente));
  const pre=r.filter(m=>m.Tipo==="Ingreso"&&esPrest(m.Fuente));
  const G=sum(gas), N=nom.length? sum(nom) : (+c.IngresoEsperado||0), E=sum(ext);
  const A=ahorroCat(c);
  const GF=(+c.GastoFondo||0)+sum(gas.filter(m=>m.Cuenta===FONDO));
  const AF=+c.ApoyoFondo||0;
  const P = c.PptoGastos!==""&&c.PptoGastos!=null ? +c.PptoGastos : (A!=null? N-A+AF : 0);
  const Gord=G-GF;
  return {r, gas, G, GF, Gord, N, P, AF, E, ext, pre, PR:sum(pre), A, queda:P-Gord, ahorro:A||0, libre:N-G, valesG:sum(r.filter(m=>m.Tipo==="Gasto"&&m.Cuenta===VALES))};
}
function metaAnio(y){ const m=(S.d.metas||[]).find(x=>String(x.Anio)===String(y)); const base=m? +m.AhorroPorCatorcena||0 : 0, n=m? +m.CatorcenasAnio||26 : 26; return {base, n, meta: m&&+m.MetaAhorroAnual? +m.MetaAhorroAnual : base*n, total: m? +m.MetaTotalAnual||0 : 0}; }
// Igual que tu hoja: NVO AHORRO P/CAT = (meta anual − ahorro acumulado) ÷ catorcenas restantes
function metaCat(c){
  const y=String(c.Anio), M=metaAnio(y);
  const cs=S.d.catorcenas.filter(k=>String(k.Anio)===y && +k.Num<=+c.Num);
  const acum=cs.reduce((s,k)=>s+(ahorroCat(k)||0),0), rest=M.n-(+c.Num);
  const falta=M.meta-acum, aFecha=M.base*(+c.Num);
  return {M, acum, rest, falta, nuevo: rest>0? Math.max(0,falta)/rest : 0, aFecha, dif:acum-aFecha};
}
function ahorrosAnio(y){
  y=String(y);
  const cs=S.d.catorcenas.filter(k=>String(k.Anio)===y && k.Inicio<=S.hoy).sort((a,b)=>a.Inicio<b.Inicio?-1:1);
  const AC=cs.reduce((s,k)=>s+(ahorroCat(k)||0),0);
  const movY=S.movs.filter(m=>m.Fecha.startsWith(y));
  const prest=movY.filter(m=>m.Tipo==="Ingreso"&&esPrest(m.Fuente)), PR=sum(prest);
  const gfHist=cs.filter(k=>+k.GastoFondo>0).map(k=>({Fecha:k.Inicio, Monto:+k.GastoFondo, Descripcion:k.NotaFondo||"Gasto del fondo", cat:+k.Num}));
  const gfApp=movY.filter(m=>m.Tipo==="Gasto"&&m.Cuenta===FONDO);
  const GF=gfHist.reduce((s,x)=>s+x.Monto,0)+sum(gfApp);
  const ext=movY.filter(m=>m.Tipo==="Ingreso"&&esExtra(m.Fuente)), EX=sum(ext);
  const apoyos=cs.filter(k=>+k.ApoyoFondo>0).map(k=>({Fecha:k.Inicio, Monto:+k.ApoyoFondo, Descripcion:"Colchón para la catorcena "+(+k.Num), cat:+k.Num}));
  const AP=apoyos.reduce((s,x)=>s+x.Monto,0), fondo=PR-GF-AP;
  return {cs, AC, prest, PR, gfHist, gfApp, GF, apoyos, AP, fondo, acum:AC+fondo, ext, EX, total:AC+fondo+EX};
}
// gasto diario (sin vales) en un rango; los días se cuentan hasta hoy si el rango no ha terminado
function porDia(a,b){ const fin=b<S.hoy?b:S.hoy; if(fin<a) return null; const d=daysBetween(a,fin)+1; const g=sum(inRange(a,fin).filter(m=>m.Tipo==="Gasto"&&m.Cuenta!==VALES)); return {g,d,v:g/d}; }
function finMes(ym){ const [y,m]=ym.split("-").map(Number); return ym+"-"+pad(new Date(y,m,0).getDate()); }
function ritmoHTML(c,x){
  const real=porDia(c.Inicio,c.Fin); if(!real) return "";
  const L=catList(), i=L.findIndex(k=>k.ID===c.ID), ant=i>0? L[i-1] : null;
  const y=S.hoy.slice(0,4), ym=S.hoy.slice(0,7), pm=addMonth(ym,-1);
  const comps=[
    ["Promedio "+y, porDia(y+"-01-01", S.hoy)],
    ["Catorcena anterior", ant? porDia(ant.Inicio, ant.Fin) : null],
    ["Mes actual ("+MES[+ym.slice(5)-1]+")", porDia(ym+"-01", finMes(ym))],
    ["Mes anterior ("+MES[+pm.slice(5)-1]+")", porDia(pm+"-01", finMes(pm))]
  ].filter(k=>k[1]);
  return `<div style="border-top:1px solid rgb(255 255 255 / .2);padding-top:10px;display:flex;flex-direction:column;gap:6px">
    <div class="between"><span class="small muted">Real: ${real.d} día${real.d!==1?"s":""} transcurridos</span><b>${mx(real.v)} por día</b></div>
    ${comps.map(([l,k])=>{ const d=k.v? (real.v-k.v)/k.v : 0; const arrow = d>0.005?"▲":d<-0.005?"▼":"="; return `<div class="between small"><span class="muted">vs ${esc(l)} · ${mx(k.v)}/día</span><span style="font-weight:700;padding:1px 8px;border-radius:99px;background:rgb(255 255 255 / .16)">${arrow} ${Math.abs(Math.round(d*100))}% ${d>0.005?"más":d<-0.005?"menos":""}</span></div>`; }).join("")}
  </div>`;
}
const catLabel = c => "Catorcena "+(+c.Num)+" · "+sDate(c.Inicio)+" – "+sDate(c.Fin)+" "+c.Fin.slice(0,4);
const perKey = p => String(p.Periodo)==="BASE" ? "BASE" : String(p.Periodo).slice(0,7);
function presupuesto(ym){ const o={}; S.d.presupuesto.forEach(p=>{ if(perKey(p)==="BASE") o[p.Categoria]=+p.Monto; }); S.d.presupuesto.forEach(p=>{ if(perKey(p)===ym) o[p.Categoria]=+p.Monto; }); return o; }
function group(arr,key){ const o={}; arr.forEach(m=>{ const k=typeof key==="function"?key(m):(m[key]||"—"); o[k]=(o[k]||0)+m.Monto; }); return Object.entries(o).sort((a,b)=>b[1]-a[1]); }
function icon(m){ const t=m.Tipo; const c = t==="Gasto"?"g": t==="Ingreso"?"i": t==="Inversión"?"v":""; const l=(t==="Gasto"? (m.Categoria||"?") : t==="Ingreso"?(m.Fuente||"Ingreso") : t).slice(0,2).toUpperCase(); return `<span class="ico ${c}">${esc(l)}</span>`; }
function itemHTML(m, conFecha){
  const sub = m.Tipo==="Gasto" ? [m.Categoria, m.Vehiculo, m.Cuenta].filter(Boolean).join(" · ")
    : m.Tipo==="Ingreso" ? [m.Fuente, m.CuentaDestino].filter(Boolean).join(" → ")
    : m.Tipo==="Inversión" ? [m.MovInversion, m.Instrumento].filter(Boolean).join(" · ")
    : [m.Cuenta, m.CuentaDestino].filter(Boolean).join(" → ");
  const cls = m.Tipo==="Gasto"?"neg": m.Tipo==="Ingreso"?"pos":"";
  const fechaTxt = conFecha ? `<b style="color:var(--ink);font-weight:600">${sDate(m.Fecha)} ${m.Fecha.slice(2,4)}</b>${sub? " · ":""}` : "";
  const pend = S.pendSet && S.pendSet.has(m.ID);
  return `<button class="item" data-id="${esc(m.ID)}">${icon(m)}<span class="grow"><div class="t">${esc(m.Descripcion||m.Subcategoria||m.Tipo)}</div><div class="s">${fechaTxt}${esc(sub)}${pend?" · por sincronizar":""}</div></span><span class="amt ${cls} ${m.Tipo==="Ingreso"||m.Tipo==="Inversión"?"priv":""}">${m.Tipo==="Gasto"?"−":m.Tipo==="Ingreso"?"+":""}${mx2(m.Monto)}</span></button>`;
}
function pendIds(){ return new Set(pend().filter(p=>p.op==="save").map(p=>p.o.ID)); }
function bindItems(root){ $$("[data-id]",root).forEach(b=>b.onclick=()=>{ const m=S.byId[b.dataset.id]; if(m) openForm(m); }); }
function barsHTML(rows,total,budget,drill){
  const max=Math.max(1,...rows.map(r=>Math.max(r[1], budget?.[r[0]]||0)));
  return `<div class="bars">${rows.map(([k,v])=>{ const b=budget?.[k]; const over=b&&v>b;
    return `<${drill?`button type="button" data-drill="${esc(drill)}" data-k="${esc(k)}" style="text-align:left;width:100%"`:"div"} class="bar-r"><div class="between"><span>${esc(k)}${drill?' <span class="muted small">›</span>':""}</span><span class="${over?"neg":""}">${mx(v)}${b?` <span class="muted small">/ ${mx(b)}</span>`:total?` <span class="muted small">${Math.round(v/total*100)}%</span>`:""}</span></div>
    <div class="track"><div class="fill" style="width:${v/max*100}%;${over?"background:var(--neg)":""}"></div>${b?`<span class="mark" style="left:${b/max*100}%"></span>`:""}</div></${drill?"button":"div"}>`; }).join("")}</div>`;
}
/* ---- zoom: detalle de una categoría, medio de pago o descripción ---- */
S.drill = {};
function setDrill(key, rows, titulo){ S.drill[key]={rows, titulo}; return key; }
function setDrillCampo(key, rows, titulo, campo){ S.drill[key]={rows, titulo, campo}; return key; }
function setDrillFn(key, rows, titulo, fn){ S.drill[key]={rows, titulo, fn, campo:"Medio"}; return key; }
function medioPago(m){ return m.Cuenta ? (S.cta[m.Cuenta]?.Tipo||m.Cuenta) : "Sin medio (histórico)"; }
document.addEventListener("click", e=>{
  const b=e.target.closest("[data-drill]"); if(!b) return;

function abrirZoom(k, titulo, rows, campo){
  const T=sum(rows), subs=group(rows, m=>m.Subcategoria||"Sin subcategoría"), desc=group(rows, m=>m.Descripcion||"—").slice(0,10);
  const meses=group(rows, m=>m.Fecha.slice(0,7)).sort((a,b)=>a[0]<b[0]?-1:1);
  const box=document.createElement("div");
  box.style.cssText="position:fixed;inset:0;background:rgb(8 10 20 / .5);display:flex;align-items:flex-end;z-index:44";
  box.innerHTML=`<div class="sheet on" style="position:relative;transform:none;max-height:90%">
    <div class="grab"></div><div class="between"><span><h2 style="margin:0;font-size:18px">${esc(k)}</h2><div class="small muted">${esc(titulo)} · ${rows.length} gastos</div></span><button type="button" class="btn sm" data-x>Cerrar</button></div>
    <div class="between"><span class="muted">Total</span><b class="mid neg">${mx(T)}</b></div>
    ${campo==="Categoria" && subs.length>1? `<div class="card"><h2>Por subcategoría</h2>${barsHTML(subs,T)}</div>`:""}
    ${campo!=="Descripcion"? `<div class="card"><h2>En qué se fue más</h2>${barsHTML(desc,T)}</div>`:""}
    ${meses.length>1? `<div class="card"><h2>Por mes</h2>${barsHTML(meses.map(([ym,v])=>[mLabel(ym),v]),T)}</div>`:""}
    <div class="card" style="padding:4px 12px"><div class="list">${rows.slice(0,60).map(m=>itemHTML(m,true)).join("")}</div>${rows.length>60? `<div class="small muted" style="padding:8px 0">Se muestran 60 de ${rows.length}.</div>`:""}</div></div>`;
  document.body.appendChild(box);
  box.querySelector("[data-x]").onclick=()=>box.remove();
  box.addEventListener("click",ev=>{ if(ev.target===box) box.remove(); });
  $$("[data-id]",box).forEach(b=>b.onclick=()=>{ const m=S.byId[b.dataset.id]; if(m){ box.remove(); openForm(m); } });
}
function effects(m){
  const v=m.Monto, o=[];
  if(m.Tipo==="Gasto") o.push([m.Cuenta,-v]);
  else if(m.Tipo==="Ingreso") o.push([m.CuentaDestino,v]);
  else if(m.Tipo==="Pago tarjeta"||m.Tipo==="Transferencia"){ o.push([m.Cuenta,-v]); o.push([m.CuentaDestino,v]); }
  else if(m.Tipo==="Inversión"){ if(m.MovInversion==="Aportación") o.push([m.Cuenta,-v]); else if(m.MovInversion==="Retiro") o.push([m.Cuenta,v]); }
  return o.filter(e=>e[0]);
}
function saldosCuentas(){
  const b={};
  S.d.cuentas.forEach(c=>b[c.Cuenta]=+c.SaldoInicial||0);
  for(const m of S.movs){ for(const [k,v] of effects(m)){ const c=S.cta[k]; if(!c) continue; if(c.FechaSaldo && m.Fecha<=c.FechaSaldo) continue; b[k]+=v; } }
  return b;
}
function msiEstado(x){
  const meses=+x.Meses||1, men=+x.Mensualidad||0;
  if(!x.PrimerPago) return {restan:0,pend:0};
  const [y1,m1,d1]=x.PrimerPago.split("-").map(Number), [y2,m2,d2]=S.hoy.split("-").map(Number);
  let pagados=(y2-y1)*12+(m2-m1)+(d2>=d1?1:0); pagados=Math.max(0,Math.min(meses,pagados));
  return {restan:meses-pagados, pend:(meses-pagados)*men, pagados};
}
function saldosInversion(){
  const out={};
  for(const i of S.ins){
    const snaps=S.d.saldosInv.filter(s=>s.Instrumento===i.Instrumento).sort((a,b)=>a.Fecha<b.Fecha?-1:1);
    const last=snaps[snaps.length-1];
    const desde=last?last.Fecha:"0000";
    let s=last?+last.Saldo:0, flujo=0;
    S.movs.forEach(m=>{ if(m.Tipo!=="Inversión"||m.Instrumento!==i.Instrumento||m.Fecha<=desde) return; const v=m.MovInversion==="Retiro"?-m.Monto:m.Monto; s+=v; flujo+=v; });
    out[i.Instrumento]={i, saldo:s, foto:last, flujo, snaps};
  }
  return out;
}

/* ================= Inicio ================= */
function rInicio(){
  const h=S.hoy, c=catorcenaActual(h);
  let hero="", kpis="";
  if(c){
    const x=catRes(c), p=x.P? x.G/x.P : 0, dias=Math.max(0,daysBetween(h,c.Fin)+1);
    hero=`<div class="card hero"><div class="between"><span class="small muted">${esc(catLabel(c))}</span><span class="small muted" style="white-space:nowrap">${dias===1? "Último día" : "Quedan "+dias+" días"}</span></div>
      <div><div class="small muted">${x.queda<0?"Te pasaste del presupuesto":"Queda del presupuesto"}</div><div class="big" style="${x.queda<0?"color:#ff9a90":""}">${mx(x.queda)}</div></div>
      <div class="track"><div class="fill" style="width:${Math.min(100,p*100)}%"></div></div>
      <div class="between small"><span>Gastado ${mx(x.Gord)} de ${mx(x.P)}${x.GF? " (+"+mx(x.GF)+" del fondo)":""}</span><span>${dias>0&&x.queda>0? "Puedes "+mx(x.queda/dias)+"/día" : x.queda<=0? "Presupuesto agotado" : ""}</span></div>
      ${x.AF? `<div class="small" style="opacity:.85">Incluye ${mx(x.AF)} de colchón del fondo</div>`:""}
      ${x.queda<0? (()=>{ const f=ahorrosAnio(c.Anio).fondo; const falta=Math.ceil(-x.queda); return f>=falta? `<button class="btn sm" id="cubrir" style="background:#fff;color:#2f3a8f;align-self:flex-start">Cubrir ${mx(falta)} con el fondo <span class="priv">(disponible ${mx(f)})</span></button>` : `<div class="small" style="opacity:.85">El fondo no alcanza para cubrir la diferencia (disponible <span class="priv">${mx(f)}</span>).</div>`; })() : ""}
      ${ritmoHTML(c,x)}</div>`;
    kpis=`<div class="kpis"><div class="kpi"><div class="l">Ingreso catorcena</div><div class="v pos priv">${mx(x.N)}</div></div>
      <div class="kpi"><div class="l">Gastado</div><div class="v neg">${mx(x.G)}</div></div>
      <div class="kpi"><div class="l">Ahorro apartado</div><div class="v priv">${x.A==null? "—" : mx(x.A)}</div></div></div>
      ${(()=>{ const mc=metaCat(c), ay=ahorrosAnio(c.Anio), tot=totalDinero();
        return `<button class="card priv" id="goAhorro" style="text-align:left;gap:6px">
          <div class="between"><h2>Ahorro ${c.Anio}</h2><span class="small muted">Ver detalle ›</span></div>
          <div class="between"><span class="muted small">Acumulado del año</span><b class="mid">${mx(ay.total)}</b></div>
          <div class="between"><span class="muted small">Nueva meta por catorcena (${mc.rest} restantes)</span><b>${mx(mc.nuevo)}</b></div>
          <div class="between"><span class="muted small">Total de dinero</span><b>${mx(tot.T)}</b></div>
          <div class="small muted">${x.queda>0? "Sobrante del presupuesto "+mx(x.queda)+" · ":""}${x.E? "Extras "+mx(x.E)+" · ":""}${x.PR? "Prestaciones al fondo "+mx(x.PR):""}</div></button>`; })()}`;
  }
  const quick = Object.entries(S.freq).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([k])=>S.mem[k]);
  const last = S.movs.slice(0,8);
  $("#p-inicio").innerHTML = hero + kpis + `
    <div class="card"><h2>Registro rápido</h2><div class="chips">${quick.map(m=>`<button class="chip" data-q="${esc(norm(m.Descripcion))}">${esc(m.Descripcion)}</button>`).join("")||'<span class="muted small">Aparecerán tus gastos más frecuentes.</span>'}</div></div>
    <div class="card" style="padding:12px 12px 4px"><div class="between"><h2>Últimos movimientos</h2><button class="btn sm" id="verTodos">Ver todos</button></div><div class="list">${last.map(itemHTML).join("")||'<div class="empty">Sin movimientos</div>'}</div></div>`;
  $$("[data-q]",$("#p-inicio")).forEach(b=>b.onclick=()=>{ const m=S.mem[b.dataset.q]; openForm({Tipo:"Gasto", Descripcion:m.Descripcion, Categoria:m.Categoria, Subcategoria:m.Subcategoria, Vehiculo:m.Vehiculo, Cuenta:m.Cuenta}); });
  $("#verTodos").onclick=()=>go("movs");

      .catch(e=>{ cb.disabled=false; cb.textContent="Reintentar"; toast("No se guardó: "+(e.message||e)); }); }; }
  bindItems($("#p-inicio"));

/* ================= Movimientos ================= */
const FILTROS = [["todos","Todos"],["Gasto","Gastos"],["Ingreso","Ingresos"],["Pago tarjeta","Pagos de tarjeta"],["Transferencia","Entre cuentas"],["Inversión","Inversiones"]];
S.mvModo="cat";
function mvShift(k){
  if(S.mvModo==="mes"){ S.mes=addMonth(S.mes,k); }
  else { const L=catList(); let i=L.findIndex(c=>c.ID===S.mvCat); if(i<0) i=L.length-1; i=Math.max(0,Math.min(L.length-1,i+k)); S.mvCat=L[i].ID; }
  S.lim=200; rMovs();
}
$("#mvPrev").onclick=()=>mvShift(-1);
$("#mvNext").onclick=()=>mvShift(1);
let qT; $("#mvQ").oninput=e=>{ clearTimeout(qT); qT=setTimeout(()=>{ S.q=norm(e.target.value); S.lim=200; rMovs(); },200); };
function rMovs(){
  const L=catList(); if(!S.mvCat){ const c=catorcenaActual(S.hoy)||L[L.length-1]; S.mvCat=c&&c.ID; }
  const cat = S.d.catorcenas.find(c=>c.ID===S.mvCat);
  $("#mvMes").textContent = S.q? "Resultados de búsqueda" : S.mvModo==="cat"&&cat ? "Catorcena "+(+cat.Num)+" · "+sDate(cat.Inicio)+"–"+sDate(cat.Fin)+" "+cat.Fin.slice(0,4) : mLabel(S.mes);

function ahorroChart(serie){
  if(serie.length<2) return "";
  const W=320,Hh=150,L=40,Rr=8,T=10,B=22, n=serie.length;
  const mxv=Math.max(1,...serie.map(s=>Math.max(s.a,s.m)));
  const X=i=>L+i*(W-L-Rr)/(n-1), Y=v=>T+(mxv-v)*(Hh-T-B)/mxv;
  const p=k=>serie.map((s,i)=>(i?"L":"M")+X(i).toFixed(1)+","+Y(s[k]).toFixed(1)).join("");
  let g=""; for(let i=0;i<=3;i++){ const v=mxv*i/3; g+=`<line x1="${L}" x2="${W-Rr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L-5}" y="${Y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${kfmt(v)}</text>`; }
  const xl=serie.map((s,i)=> i%Math.ceil(n/6)===0||i===n-1? `<text x="${X(i)}" y="${Hh-6}" text-anchor="middle" font-size="10" fill="var(--muted)">C${s.n}</text>`:"").join("");
  return `<svg viewBox="0 0 ${W} ${Hh}" width="100%" style="display:block" role="img" aria-label="Ahorro acumulado contra meta">${g}
    <path d="${p("m")}" fill="none" stroke="var(--muted)" stroke-width="1.6" stroke-dasharray="4 3"/>
    <path d="${p("a")}" fill="none" stroke="var(--pos)" stroke-width="2.4"/>${xl}</svg>
    <div class="legend"><span><i style="background:var(--pos)"></i>Ahorro acumulado</span><span><i style="background:var(--muted)"></i>Meta a la fecha</span></div>`;
}

function comprimirFoto(file){
  return new Promise((res,rej)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{ const s=Math.min(1, 1400/img.width, 3600/img.height); const c=document.createElement("canvas"); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
      const x=c.getContext("2d"); x.filter="grayscale(1) contrast(1.25)"; x.drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
      res(c.toDataURL("image/jpeg",0.75).split(",")[1]); };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error("No pude abrir la foto.")); };
    img.src=url;
  });
}
const TIENDAS=["BODEGA AURRERA","MI BODEGA","AURRERA","WALMART","WAL-MART","SAMS","SAM'S","SORIANA","CHEDRAUI","LA COMER","FRESKO","CITY MARKET","SUMESA","HEB","H-E-B","SUPERAMA","COSTCO","CASA LEY","LEY","CALIMAX","ALSUPER","MERZA","SMART","S-MART","NETO","TIENDAS 3B","3B","MERCO","OXXO","7-ELEVEN","7 ELEVEN","CIRCLE K","FARMACIAS GUADALAJARA","FARMACIA GUADALAJARA","FARMACIAS DEL AHORRO","FARMACIA SAN PABLO","SAN PABLO","BENAVIDES","SUPER KOMPRAS","SUPER ISSSTE","WALDOS","DEL SOL","COPPEL","LIVERPOOL"];
const NO_ART=/\b(sub\s*-?total|total|iva|i\.v\.a|ieps|cambio|efectivo|tarjeta|vales?|pago|importe|su\s+ahorro|ahorro|redondeo|art[ií]culos|arts?\.?\b|saldo|monedero|puntos|rfc|folio|ticket|caja|cajero|tienda|sucursal|tel[eé]fono|gracias|cliente|autoriza|aprob|referencia|no\.\s*de|transacc|operaci|cuenta|venc|fecha|hora|d[eé]bito|cr[eé]dito|visa|master|electr[oó]nic|despensa|sodexo|edenred|si\s*vale|pluxee|bono)\b/i;
const NO_ART2=/(=|\bfol|\bid\b|r[eé]gimen|s\.\s?a\.|c\.\s?v\.|colonia|c\.\s?p\.|n[uú]mero|calle|av\.|emisor|venta\b|afiliaci|\baut\b|pesos|m\.\s?n\.|bbva|banamex|santander|inbursa|banorte|hsbc|scotiabank|iva incluido|gracias|vuelva|www\.|\.com\b|sociedades|cadena comercial|tel\b|sucursal|cajer)/i;
// limpia códigos de barras, cantidades y signos del nombre del artículo
function limpiarNombre(s){
  return String(s||"").replace(/^\s*\d{6,14}\s*/,"").replace(/\b\d+(\.\d+)?\s*[x@]\s*\$?\d+[.,]\d{2}\b/i,"").replace(/[$*]+/g,"").replace(/\s+\d{1,2}\s*$/,"").replace(/\s+/g," ").trim();
}
// un nombre válido tiene al menos una palabra de 3 letras y no es un código suelto (p. ej. FEARR00708140)
function esNombre(s){
  if(!s || !/[A-Za-zÁÉÍÓÚÑ]{3,}/.test(s)) return false;
  const pal=s.split(" ");
  if(pal.length===1 && /\d/.test(s) && /[A-Za-z]/.test(s) && s.length>=7) return false;
  if(/\d{2}[\/\-]\d{2}[\/\-]\d{2,4}|\d{1,2}:\d{2}/.test(s)) return false;
  return true;
}
function numTk(s){ return parseFloat(String(s).replace(/[$\s,]/g,"")); }
function parseTicket(texto){
  const L=texto.replace(/\r/g,"").split("\n").map(l=>l.replace(/\s+/g," ").trim()).filter(Boolean);
  const up=texto.toUpperCase();
  let tienda=TIENDAS.find(t=>up.includes(t)) || "";
  if(!tienda){ const l=L.find(x=>/[A-Za-zÁÉÍÓÚÑ]{3,}/.test(x) && !/\d{3,}/.test(x)); tienda=l||""; }
  tienda = tienda.toLowerCase().replace(/(^|[\s\-])([a-záéíóúñ])/g,(x,a,c)=>a+c.toUpperCase());
  // fecha dd/mm/aa o dd-MMM-aaaa
  let fecha="";
  const MM={ENE:1,FEB:2,MAR:3,ABR:4,MAY:5,JUN:6,JUL:7,AGO:8,SEP:9,SEPT:9,OCT:10,NOV:11,DIC:12,JAN:1,APR:4,AUG:8,DEC:12};
  let m=up.match(/\b(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})\b/);
  if(m){ let y=+m[3]; if(y<100) y+=2000; const d=+m[1], mo=+m[2]; if(mo>=1&&mo<=12&&d>=1&&d<=31&&y>2015) fecha=y+"-"+pad(mo)+"-"+pad(d); }
  if(!fecha){ m=up.match(/\b(\d{1,2})[\/\-. ]?(ENE|FEB|MAR|ABR|MAY|JUN|JUL|AGO|SEPT?|OCT|NOV|DIC|JAN|APR|AUG|DEC)[A-Z]*[\/\-. ]?(\d{2,4})\b/);
    if(m){ let y=+m[3]; if(y<100) y+=2000; fecha=y+"-"+pad(MM[m[2]])+"-"+pad(+m[1]); } }
  // total
  let total=0;
  const precio=/(-?\$?\s?\d{1,3}(?:,\d{3})*[.,]\d{2})\s*[A-Z*]{0,2}\s*$/;
  for(let i=0;i<L.length;i++){
    if(/\btotal\b/i.test(L[i]) && !/sub\s*-?total|art/i.test(L[i])){
      let mm=L[i].match(precio) || (L[i+1]&&L[i+1].match(/^\$?\s?(\d{1,3}(?:,\d{3})*[.,]\d{2})/));
      if(mm){ const v=numTk(mm[1].replace(/,(\d{2})$/,".$1")); if(v>total) total=v; }
    }
  }
  // artículos: "DESCRIPCION ... 29.90", o descripción y precio en líneas separadas (el OCR a veces lee primero toda la columna izquierda)
  const items=[]; const cola=[];
  for(let i=0;i<L.length;i++){
    const l=L[i];
    if(/\btotal\b/i.test(l)){ cola.length=0; }
    if(NO_ART.test(l) || NO_ART2.test(l)) continue;
    const mm=l.match(precio);
    if(mm){
      let nombre=limpiarNombre(l.slice(0,mm.index));
      if(!esNombre(nombre)) nombre=cola.shift()||"";
      const v=numTk(mm[1].replace(/,(\d{2})$/,".$1"));
      if(esNombre(nombre) && v>0 && v<20000 && (!total || v<=total)) items.push({n:nombre.slice(0,60), m:v});
    } else {
      // las primeras líneas son el encabezado (razón social, sucursal, dirección): no son artículos
      const n=limpiarNombre(l);
      if(i>=4 && esNombre(n) && !(tienda && norm(n).includes(norm(tienda)))) cola.push(n);
    }
  }
  if(!total) total=Math.round(items.reduce((s,x)=>s+x.m,0)*100)/100;
  return {tienda, fecha, total, items};
}

    <div class="two"><div class="f"><label for="rtT">Tienda</label><input id="rtT" value="${esc(t.tienda||"")}"></div><div class="f"><label for="rtF">Fecha</label><input id="rtF" type="date" value="${t.fecha||$("#fFecha").value}"></div></div>
    <div class="f"><label for="rtTot">Total pagado con vales</label><input id="rtTot" type="number" inputmode="decimal" step="0.01" value="${t.total||""}"></div>
    <div class="between small"><b>Artículos</b><span id="rtSum" class="muted"></span></div>
    <div id="rtItems" style="display:flex;flex-direction:column;gap:6px">${t.items.map(fila).join("")}</div>
    <button type="button" class="btn sm" id="rtAdd" style="align-self:flex-start">+ Agregar artículo</button>
    <div class="actions"><button type="submit" class="btn primary">Usar este ticket</button></div></form>`;
  document.body.appendChild(box);
  const leer=()=>$$("[data-i]",box).map(r=>({n:$("[data-n]",r).value.trim(), m:parseFloat($("[data-m]",r).value)||0})).filter(x=>x.n&&x.m);
  const suma=()=>{ const s=leer().reduce((a,x)=>a+x.m,0), T=parseFloat($("#rtTot",box).value)||0, d=Math.round((T-s)*100)/100;
    $("#rtSum",box).innerHTML = "Suma "+mx2(s)+(T&&Math.abs(d)>0.5? ` · <span class="warn">diferencia ${mx2(d)} con el total</span>` : T? " · cuadra con el total":""); };
  const bind=()=>{ $$("[data-del]",box).forEach(b=>b.onclick=()=>{ b.closest("[data-i]").remove(); suma(); }); $$("input",box).forEach(i=>i.oninput=suma); };
  bind(); suma();
  $("#rtAdd",box).onclick=()=>{ $("#rtItems",box).insertAdjacentHTML("beforeend", fila({n:"",m:""}, Date.now())); bind(); $("#rtItems [data-i]:last-child [data-n]",box).focus(); };
  box.querySelector("[data-x]").onclick=()=>box.remove();
  box.querySelector("form").onsubmit=ev=>{ ev.preventDefault();
    const items=leer(), T=parseFloat($("#rtTot",box).value)||items.reduce((a,x)=>a+x.m,0);
    F.ticket={id:t.id, tienda:$("#rtT",box).value.trim(), items};
    $("#fMonto").value=Math.round(T*100)/100;
    if($("#rtF",box).value) $("#fFecha").value=$("#rtF",box).value;
    if(!$("#fDesc").value || F.ticket.tienda) $("#fDesc").value = F.ticket.tienda ? "Despensa "+F.ticket.tienda : "Despensa con vales";
    if(!$("#fCat").value){ $("#fCat").value="Súper y despensa"; tipo(F.t,true); }
    if(!$("#fSub").value) $("#fSub").value="Despensa (vales)";
    box.remove(); pintarTicket(); toast("Ticket listo: revisa y guarda");
  };
}

/* ================= Formulario ================= */
const F = { t:"Gasto", edit:null };
function opt(list, sel, ph){ return (ph!=null?`<option value="">${esc(ph)}</option>`:"")+list.map(v=>`<option${v===sel?" selected":""}>${esc(v)}</option>`).join(""); }
function ctaOpts(tipos, sel){
  const g={}; S.d.cuentas.filter(c=>!String(c.Activa).toLowerCase().startsWith("n") && (!tipos||tipos.includes(c.Tipo))).forEach(c=>(g[c.Tipo] ||= []).push(c.Cuenta));
  return '<option value="">Elige…</option>'+Object.entries(g).map(([t,l])=>`<optgroup label="${esc(t)}">${l.map(c=>`<option${c===sel?" selected":""}>${esc(c)}</option>`).join("")}</optgroup>`).join("");
}
function openForm(m){
  m = m || {};
  F.edit = m.ID ? m : null;
  F.t = m.Tipo || "Gasto";
  $("#fTitle").textContent = F.edit? "Editar movimiento" : "Nuevo movimiento";
  $("#fDel").classList.toggle("hide", !F.edit); $("#fAgain").classList.toggle("hide", !!F.edit);
  $("#fMonto").value = m.Monto || "";
  $("#fFecha").value = m.Fecha || S.hoy;
  $("#fCat").innerHTML = opt(Object.keys(S.cats), m.Categoria, "Elige…");
  $("#fFuente").innerHTML = opt(S.fuentes, m.Fuente || S.fuentes[0]);
  $("#fIns").innerHTML = opt(S.ins.map(i=>i.Instrumento), m.Instrumento, "Elige…");
  $("#fInvM").value = m.MovInversion || "Aportación";
  $("#fDesc").value = m.Descripcion || ""; $("#fSub").value = m.Subcategoria || ""; $("#fNota").value = m.Nota || "";
  $("#fKm").value = m.Km || ""; $("#fLt").value = m.Litros || ""; $("#fMsi").value = m.MesesMSI || "";
  F.veh = m.Vehiculo || "";
  F.cta = m.Cuenta !== undefined ? m.Cuenta : (F.t==="Gasto" ? (store("fc_lastCta")||"") : "");
  F.dst = m.CuentaDestino || "";
  F.ticket = m.Ticket || null;
  if(!F.ticket && m.ID){ const its=(S.d.tickets||[]).filter(t=>t.MovID===m.ID); if(its.length) F.ticket={id:its[0].TicketID, tienda:its[0].Tienda, items:its.map(t=>({n:t.Articulo,m:+t.Monto}))}; }
  pintarTicket();
  $("#fErr").textContent = "";
  $("#fCta").innerHTML = ""; $("#fDst").innerHTML = "";
  tipo(F.t, true);
  $("#scrim").classList.add("on"); $("#sheet").classList.add("on");
  if(!m.Monto) setTimeout(()=>$("#fMonto").focus(), 260);
}
function closeForm(){ $("#scrim").classList.remove("on"); $("#sheet").classList.remove("on"); document.activeElement && document.activeElement.blur(); }
function tipo(t, keep){
  F.t=t;
  if(!keep){ F.cta=""; F.dst=""; }
  $$("#fTipo .chip").forEach(b=>b.classList.toggle("on", b.dataset.t===t));
  const isAuto = t==="Gasto" && S.autoCats.has($("#fCat").value);
  const cuenta = $("#fCta").value || F.cta, ctaTipo = S.cta[cuenta]?.Tipo;
  const show = {Gasto:t==="Gasto", Ingreso:t==="Ingreso", "Inversión":t==="Inversión", veh:isAuto,
    cta: t!=="Ingreso" && !(t==="Inversión" && $("#fInvM").value==="Rendimiento"),
    dst: ["Ingreso","Pago tarjeta","Transferencia"].includes(t),
    msi: t==="Gasto" && (ctaTipo==="Crédito"||ctaTipo==="Departamental") && !F.edit,
    vales: t==="Gasto" && ctaTipo==="Vales"};
  $$("#sheet [data-for]").forEach(el=>el.classList.toggle("hide", !show[el.dataset.for]));
  if(show.vales){ const sv=S.movs.filter(m=>(m.Tipo==="Ingreso"&&m.Fuente===VALES)||(m.Tipo==="Gasto"&&m.Cuenta===VALES)).reduce((s,m)=>s+(m.Tipo==="Ingreso"?m.Monto:-m.Monto),0); $("#valesSaldo").textContent="Saldo disponible en vales: "+mx2(sv); }
  const L = {Gasto:["Pagado con",""], Ingreso:["","Entra a"], "Pago tarjeta":["Pagado desde","Tarjeta que pagas"], Transferencia:["Sale de","Llega a"], "Inversión":[$("#fInvM").value==="Retiro"?"Cuenta que recibe":"Sale de",""]}[t];
  if(L[0]) $("#fCtaL").textContent=L[0]; if(L[1]) $("#fDstL").textContent=L[1];
  $("#fCta").innerHTML = ctaOpts(t==="Pago tarjeta"? ["Débito","Efectivo"] : null, cuenta);
  let dst = $("#fDst").value || F.dst;
  if(t==="Ingreso" && !dst){ const fu=$("#fFuente").value; dst = /vales/i.test(fu)? "Vales de despensa" : /tenate/i.test(fu)? "Efectivo" : (S.d.cuentas.find(c=>c.Tipo==="Débito")||{}).Cuenta; }
  $("#fDst").innerHTML = ctaOpts(t==="Pago tarjeta"? ["Crédito","Departamental"] : null, dst);
  $("#fSub").setAttribute("list","dlSub"); $("#dlSub").innerHTML = (S.cats[$("#fCat").value]||[]).map(s=>`<option value="${esc(s)}">`).join("");
  $("#fVeh").innerHTML = S.vehs.map(v=>`<button type="button" class="chip ${F.veh===v?"on":""}" data-v="${esc(v)}">${esc(v)}</button>`).join("");
  $$("#fVeh .chip").forEach(b=>b.onclick=()=>{ F.veh=b.dataset.v; tipo(F.t,true); });
  const q = t==="Gasto" ? Object.entries(S.freq).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([k])=>S.mem[k]) : [];
  $("#fQuick").innerHTML = F.edit? "" : q.map(m=>`<button type="button" class="chip" data-qq="${esc(norm(m.Descripcion))}">${esc(m.Descripcion)}</button>`).join("");
  $$("#fQuick .chip").forEach(b=>b.onclick=()=>applyMem(S.mem[b.dataset.qq], true));
}
function applyMem(m, setDesc){
  if(!m) return;
  if(setDesc) $("#fDesc").value=m.Descripcion;
  $("#fCat").value=m.Categoria||""; $("#fSub").value=m.Subcategoria||"";
  F.veh=m.Vehiculo||F.veh;
  if(m.Cuenta){ F.cta=m.Cuenta; $("#fCta").value=""; }
  tipo("Gasto",true);
  if(m.Cuenta) $("#fCta").value=m.Cuenta;
}
$$("#fTipo .chip").forEach(b=>b.onclick=()=>tipo(b.dataset.t));
$("#fCat").onchange=()=>{ $("#fSub").value=""; tipo(F.t,true); };
$("#fCta").onchange=()=>{ F.cta=$("#fCta").value; tipo(F.t,true); };
$("#fInvM").onchange=()=>tipo(F.t,true);
$("#fFuente").onchange=()=>{ $("#fDst").value=""; F.dst=""; tipo(F.t,true); };
$("#fDesc").onchange=()=>{ if(F.t==="Gasto" && !F.edit){ const m=S.mem[norm($("#fDesc").value)]; if(m) applyMem(m,false); } };
$("#fClose").onclick=closeForm; $("#scrim").onclick=closeForm;
let delArm=false;
$("#fDel").onclick=()=>{
  if(!delArm){ delArm=true; $("#fDel").textContent="¿Seguro?"; setTimeout(()=>{ delArm=false; $("#fDel").textContent="Eliminar"; },3000); return; }
  delArm=false; $("#fDel").textContent="Eliminar";
  const id=F.edit.ID; S.movs=S.movs.filter(m=>m.ID!==id); sortMovs();
  const p=pend().filter(x=>!(x.op==="save"&&x.o.ID===id)); p.push({op:"del",id}); setPend(p);
  closeForm(); render(); toast("Movimiento eliminado"); flush();
};
function submit(again){
  const t=F.t, e=$("#fErr"), v=id=>$(id).value.trim();
  const o = { ID: F.edit? F.edit.ID : uid(), Tipo:t, Fecha:v("#fFecha"), Monto:Math.round(parseFloat(v("#fMonto"))*100)/100, Descripcion:v("#fDesc"), Nota:v("#fNota"),
    Categoria:"", Subcategoria:"", Cuenta:"", CuentaDestino:"", Vehiculo:"", Km:"", Litros:"", Fuente:"", Instrumento:"", MovInversion:"", MesesMSI:"" };
  if(!o.Fecha) return e.textContent="Falta la fecha.";
  if(!(o.Monto>0)) return e.textContent="Escribe un monto mayor a cero.";
  if(t==="Gasto"){
    o.Categoria=v("#fCat"); o.Subcategoria=v("#fSub"); o.Cuenta=v("#fCta"); o.MesesMSI=$("#fMsi").closest("[data-for]").classList.contains("hide")?"":v("#fMsi");
    if(!o.Categoria) return e.textContent="Elige una categoría.";
    if(!o.Cuenta) return e.textContent="Indica con qué se pagó.";
    if(S.autoCats.has(o.Categoria)){ o.Vehiculo=F.veh; o.Km=v("#fKm"); o.Litros=v("#fLt"); }
    store("fc_lastCta", o.Cuenta);
  } else if(t==="Ingreso"){ o.Fuente=v("#fFuente"); o.CuentaDestino=v("#fDst"); if(!o.CuentaDestino) return e.textContent="¿A qué cuenta entró?"; if(!o.Descripcion) o.Descripcion=o.Fuente; }
  else if(t==="Pago tarjeta"||t==="Transferencia"){ o.Cuenta=v("#fCta"); o.CuentaDestino=v("#fDst"); if(!o.Cuenta||!o.CuentaDestino) return e.textContent="Elige origen y destino."; if(o.Cuenta===o.CuentaDestino) return e.textContent="Origen y destino deben ser distintos."; if(!o.Descripcion) o.Descripcion=t+" "+o.CuentaDestino; }
  else if(t==="Inversión"){ o.MovInversion=v("#fInvM"); o.Instrumento=v("#fIns"); if(!o.Instrumento) return e.textContent="Elige el instrumento."; if(o.MovInversion!=="Rendimiento"){ o.Cuenta=v("#fCta"); if(!o.Cuenta) return e.textContent="Elige la cuenta."; } if(!o.Descripcion) o.Descripcion=o.MovInversion+" "+o.Instrumento; }
  if(F.edit){ ["Origen","ConceptoExcel","Registrado","Usuario"].forEach(k=>{ if(F.edit[k]!==undefined) o[k]=F.edit[k]; }); }
  if(t==="Gasto" && F.ticket && S.cta[o.Cuenta]?.Tipo==="Vales"){ o.Ticket=F.ticket; guardarTicketLocal(o); }
  // guardado optimista + cola
  const i=S.movs.findIndex(m=>m.ID===o.ID); if(i>=0) S.movs[i]=o; else S.movs.push(o); sortMovs();
  if(t==="Gasto" && o.Descripcion){ const k=norm(o.Descripcion); S.mem[k]=o; S.freq[k]=(S.freq[k]||0)+1; }
  const p=pend().filter(x=>!(x.op==="save"&&x.o.ID===o.ID)); p.push({op:"save",o}); setPend(p);
  toast((F.edit?"Actualizado: ":"Guardado: ")+(o.Descripcion||t)+" "+mx2(o.Monto));
  flush();
  if(again){ F.ticket=null; pintarTicket(); $("#fMonto").value=""; $("#fDesc").value=""; $("#fNota").value=""; $("#fKm").value=""; $("#fLt").value=""; e.textContent=""; F.edit=null; tipo(t,true); $("#fMonto").focus(); }
  else closeForm();
  render();
}
$("#sheet").addEventListener("submit", ev=>{ ev.preventDefault(); submit(false); });
$("#fAgain").onclick=()=>submit(true);

syncBadge();
load();
</script>
